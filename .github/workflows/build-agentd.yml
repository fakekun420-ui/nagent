name: build-agentd
on:
  push:
    branches: [main]
    paths: ["agentd/**", ".github/workflows/build-agentd.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agentd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o agentd-linux-arm64 .
      - run: sha256sum agentd-linux-arm64 | tee agentd-linux-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agentd-linux-arm64
          path: |
            agentd/agentd-linux-arm64
            agentd/agentd-linux-arm64.sha256
