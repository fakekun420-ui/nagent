name: build-app
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: keystore desde Secrets (B4, nunca en repo)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nagent.keystore"
          ls -l "$RUNNER_TEMP/nagent.keystore"
      - name: assembleRelease firmado
        working-directory: app
        env:
          KS: ${{ runner.temp }}/nagent.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          gradle --no-daemon assembleRelease \
            -PnagentKs="$KS" -PnagentKsPass="$KS_PASS" \
            -PnagentKeyAlias="$KEY_ALIAS" -PnagentKeyPass="$KEY_PASS"
      - run: sha256sum app/build/outputs/apk/release/*.apk | tee app-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nagent-app
          path: |
            app/build/outputs/apk/release/*.apk
            app-apk.sha256
